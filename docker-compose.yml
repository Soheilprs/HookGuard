# Local PostgreSQL only. Host 5434 → container 5432.
# API, web, and workers run on the host via npm (see docs/DEPLOYMENT.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: hookguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hookguard
    ports:
      - '5434:5432'
    volumes:
      - hookguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hookguard_pg:
